name: P0 smoke, P4 and P5a integration tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test P0
        run: ./scripts/test-p0.sh
      - name: Test P4 AI drafts with the local fake provider
        run: bash scripts/test-p4-ai-recipes.sh
      - name: Test P5a.1 Keycloak linking and bearer authentication
        run: bash scripts/test-p5a-keycloak.sh
      - name: Test P5a.2 ChatGPT OAuth behind a simulated HTTPS edge
        run: bash scripts/test-p5a2-chatgpt-oauth.sh
