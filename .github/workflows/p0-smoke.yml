name: P0 smoke and P4 integration tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test P0
        run: ./scripts/test-p0.sh
      - name: Test P4 AI drafts with the local fake provider
        run: bash scripts/test-p4-ai-recipes.sh
