services:
  db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kuechenfuchs}
      POSTGRES_USER: ${POSTGRES_USER:-kuechenfuchs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein; .env.example ist nur für lokale Entwicklung}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - backend

  api:
    image: kuechenfuchs/api:local
    build:
      context: ./backend/Kuechenfuchs.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_ENVIRONMENT: Development
      Database__Host: db
      Database__Port: 5432
      Database__Name: ${POSTGRES_DB:-kuechenfuchs}
      Database__User: ${POSTGRES_USER:-kuechenfuchs}
      Database__Password: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein; .env.example ist nur für lokale Entwicklung}
      Database__GssEncryptionMode: Disable
      Authentication__CookieLifetimeSeconds: ${AUTH_COOKIE_LIFETIME_SECONDS:-28800}
      DataProtection__KeysPath: /var/lib/kuechenfuchs/keys
      Ai__Enabled: ${AI_ENABLED:-false}
      Ai__RequestsPerMinutePerUser: ${AI_REQUESTS_PER_MINUTE_PER_USER:-8}
      Ai__MaxMonthlyRequestsPerHousehold: ${AI_MAX_MONTHLY_REQUESTS_PER_HOUSEHOLD:-100}
      Ai__MonthlyBudgetUsd: ${AI_MONTHLY_BUDGET_USD:-0}
      Ai__MaxInputTokens: ${AI_MAX_INPUT_TOKENS:-16000}
      Ai__MaxOutputTokens: ${AI_MAX_OUTPUT_TOKENS:-1500}
      Ai__TimeoutSeconds: ${AI_TIMEOUT_SECONDS:-30}
      Ai__ReservationExpirationSeconds: ${AI_RESERVATION_EXPIRATION_SECONDS:-180}
      Ai__MaxPromptCharacters: ${AI_MAX_PROMPT_CHARACTERS:-2000}
      Ai__InputUsdPerMillionTokens: ${AI_INPUT_USD_PER_MILLION_TOKENS:-0}
      Ai__OutputUsdPerMillionTokens: ${AI_OUTPUT_USD_PER_MILLION_TOKENS:-0}
      Ai__OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      Ai__OpenAI__Model: ${OPENAI_MODEL:-gpt-4.1-mini}
      Ai__OpenAI__BaseUrl: ${OPENAI_BASE_URL:-}
    volumes:
      - aspnet_data_protection:/var/lib/kuechenfuchs/keys
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "Kuechenfuchs.Api.dll", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend

  bootstrap:
    image: kuechenfuchs/api:local
    build:
      context: ./backend/Kuechenfuchs.Api
      dockerfile: Dockerfile
    profiles:
      - bootstrap
    command: ["--bootstrap-admin"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Host: db
      Database__Port: 5432
      Database__Name: ${POSTGRES_DB:-kuechenfuchs}
      Database__User: ${POSTGRES_USER:-kuechenfuchs}
      Database__Password: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein; .env.example ist nur für lokale Entwicklung}
      Database__GssEncryptionMode: Disable
      Bootstrap__AdminEmail: ${INITIAL_ADMIN_EMAIL:-}
      Bootstrap__AdminPassword: ${INITIAL_ADMIN_PASSWORD:-}
      Bootstrap__HouseholdName: ${INITIAL_HOUSEHOLD_NAME:-Unser Zuhause}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - backend

  caddy:
    image: kuechenfuchs/web:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend
      - ingress

volumes:
  postgres_data:
  aspnet_data_protection:

networks:
  backend:
    internal: true
  ingress:
