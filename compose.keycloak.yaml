# Lokale Keycloak-Testumgebung (P5a.1). Nur zusammen mit compose.yaml verwenden:
#   docker compose -f compose.yaml -f compose.keycloak.yaml up --build --detach
# Keycloak ist ausschließlich an 127.0.0.1 gebunden; PostgreSQL-Instanzen haben keinen Host-Port.
# Keine öffentliche Domain, keine ChatGPT-Redirect-URIs und keine Default-Secrets.
services:
  keycloak-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD muss gesetzt sein}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=keycloak --dbname=keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - keycloak-backend

  keycloak:
    # Basisimage mit fester Version und Digest in deploy/keycloak/Dockerfile.
    image: kuechenfuchs/keycloak:26.7.5-local
    build:
      context: ./deploy/keycloak
      dockerfile: Dockerfile
    environment:
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD muss gesetzt sein}
      # Fester Issuer für Browser und Tokens; interne Backchannel-Aufrufe der API nutzen http://keycloak:8080.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-kuechenfuchs-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD muss gesetzt sein}
      # Platzhalter für den Realm-Import (deploy/keycloak/import/kuechenfuchs-realm.json).
      KC_LINK_CLIENT_SECRET: ${KEYCLOAK_LINK_CLIENT_SECRET:?KEYCLOAK_LINK_CLIENT_SECRET muss gesetzt sein}
      KC_LINK_REDIRECT_URI: http://localhost:${HTTP_PORT:-8080}/api/v1/integrations/keycloak/callback
      KC_CHATGPT_ACTIONS_CLIENT_SECRET: ${KEYCLOAK_CHATGPT_ACTIONS_CLIENT_SECRET:?KEYCLOAK_CHATGPT_ACTIONS_CLIENT_SECRET muss gesetzt sein}
    volumes:
      - ./deploy/keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - keycloak-backend
      - backend
      - ingress

  api:
    environment:
      Keycloak__Enabled: "true"
      Keycloak__Issuer: http://localhost:${KEYCLOAK_PORT:-8180}/realms/kuechenfuchs
      Keycloak__MetadataAddress: http://keycloak:8080/realms/kuechenfuchs/.well-known/openid-configuration
      Keycloak__RequireHttpsMetadata: "false"
      Keycloak__ApiAudience: kuechenfuchs-api
      Keycloak__AllowedClientIds__0: chatgpt-actions
      Keycloak__LinkClientId: kuechenfuchs-link
      Keycloak__LinkClientSecret: ${KEYCLOAK_LINK_CLIENT_SECRET:?KEYCLOAK_LINK_CLIENT_SECRET muss gesetzt sein}
      Keycloak__LinkRedirectUri: http://localhost:${HTTP_PORT:-8080}/api/v1/integrations/keycloak/callback
      Keycloak__ClockSkewSeconds: ${KEYCLOAK_CLOCK_SKEW_SECONDS:-30}

volumes:
  keycloak_postgres_data:

networks:
  keycloak-backend:
    internal: true
